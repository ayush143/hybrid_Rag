[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.24.0",
    "llama-index>=0.14.24",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-google-genai>=0.11.2",
    "llama-index-llms-ollama>=0.11.0",
    "llama-index-retrievers-bm25>=0.8.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "nest-asyncio>=1.6.0",
    "pypdf>=6.19.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
hybrid-rag = "hybrid_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
